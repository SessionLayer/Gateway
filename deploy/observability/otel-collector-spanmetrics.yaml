# SessionLayer — OpenTelemetry Collector config deriving Gateway/Agent RED metrics
# from spans.
#
# WHY span-derived: the Gateway and Agent are Tier-0 Rust binaries that scrape nothing
# and expose no Prometheus endpoint of their own, deliberately (fewer moving parts on the
# plaintext data plane; no extra listener on Tier-0). Their Rate/Errors/Duration is
# therefore derived centrally by the collector's `spanmetrics` connector off the span
# inventory below, with zero code change to the hardened binaries. The CP's own SLOs come
# from its Micrometer meters (ControlPlane/deploy/observability/prometheus-slo-rules.yaml);
# these span-metrics complete the data-path half.
#
# Span-derived is not the whole story, though: `register_gateway_gauges_on`
# (gateway-core/src/telemetry.rs) also pushes two OTLP *gauges* —
# `sessionlayer.gateway.live_sessions` and `sessionlayer.gateway.lock_feed_healthy` — which
# no span can express, because they are levels rather than events. Those arrive on the same
# OTLP receiver and need the `metrics` pipeline below to reach Prometheus; without it they
# are received and dropped, and the two signals the runbook pages on have no data path at
# all. A pipeline that silently discards what it accepts is the failure this file has to
# avoid, so the receiver, the pipelines and this comment are one unit — change one and
# check the other two.
#
# Span inventory (OTEL-CONTRACT), spelled exactly as emitted, because the name is
# carried verbatim as the `span_name` label value and a selector that drops the
# prefix matches nothing: gateway.session / gateway.outer_leg.auth /
# gateway.node.connect / gateway.host_verify / gateway.bridge_setup (Gateway root)
# → cp.authorize / cp.cert_sign (CP, gRPC children) → agent.dial_back /
# agent.splice (Agent, session-correlated).
# Attributes are IDs + closed enums + outcomes only — NEVER plaintext (proven by
# ObservabilityIT + telemetry_no_content.rs), so promoting them to metric dimensions
# is safe.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

connectors:
  spanmetrics:
    histogram:
      explicit:
        # Buckets straddle the NFR-4 250 ms establishment budget so the data-path
        # legs (host_verify, node.connect, bridge_setup) are queryable against it.
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s]
    dimensions:
      # Low-cardinality closed enums only (never session_id/correlation_id/node_id —
      # those stay on the trace per OTEL-CONTRACT §7).
      - name: sessionlayer.outcome
      - name: sessionlayer.access_model
    exemplars:
      enabled: true
    metrics_flush_interval: 15s

exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    # Keep the resource service.name as a metric label so Gateway vs Agent split.
    resource_to_telemetry_conversion:
      enabled: true

  # The trace store. Substitute your own endpoint — Tempo, Jaeger and any other
  # OTLP-native backend take this unchanged. It exists because `spanmetrics` is a
  # CONNECTOR, not an exporter: it consumes the span to derive RED metrics and stores
  # nothing. A traces pipeline exporting only to the connector therefore produces healthy
  # dashboards and retains no trace, which is precisely the evidence the troubleshooting
  # guide sends an operator to read by session_id during an incident.
  otlp/traces:
    endpoint: tempo.observability.svc:4317

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [spanmetrics, otlp/traces]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      exporters: [prometheus]
    # The Gateway's pushed gauges (live_sessions, lock_feed_healthy). Separate from the
    # span-derived pipeline above because they share no source: these come straight off the
    # OTLP receiver, and only this pipeline gives them anywhere to go.
    metrics:
      receivers: [otlp]
      exporters: [prometheus]
