replicaCount: 1

image:
  repository: ghcr.io/sessionlayer/gateway
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

config:
  existingSecret: ""
  existingSecretKey: "gateway.json"
  overrides: {}

trustAnchor:
  existingConfigMap: ""
  key: "ca.pem"

controlPlane:
  mtlsEndpoint: ""
  serverName: ""

bootstrap:
  # Off means this Gateway already holds an identity in a persistent data dir.
  # A Gateway with neither an identity nor a bootstrap block can never obtain
  # one and never says why, so the chart demands one or the other.
  enabled: true
  enrollmentToken: ""
  gatewayName: ""

dataDir: "/var/lib/sessionlayer-gateway"

ssh:
  listenPort: 2222
  hostKeyPath: "/var/lib/sessionlayer-gateway/host_ed25519"
  sourceIpAllowlist: []
  # The load balancer's own ranges, which turns PROXY protocol v2 on. A
  # connection from one of these must then carry a v2 header and is dropped
  # otherwise, and one from anywhere else is dropped as well, so this both
  # recovers the client address behind a proxying load balancer and closes the
  # path around it. Empty leaves PROXY off and the peer address is used as-is.
  proxy:
    lbCidrs: []
  agent:
    listenPort: 9444
    advertiseUrl: ""

ha:
  mode: single_instance
  # The Gateway's own coordination schema. in_process cannot span pods, so a
  # multi-replica deployment serving agent-based nodes needs the nats backend:
  # {backend: nats, url: "nats://...", subject_prefix: sl}.
  coordination:
    backend: in_process
  drain:
    preDrainGraceSecs: 5
    deadlineSecs: 30
    readyzPort: 8081

hardening:
  landlock:
    enabled: true
    required: false
    # /run/systemd/resolve is deliberately absent: it is a systemd-resolved
    # runtime directory, and no distroless image has one. A listed path that
    # does not exist is skipped with a startup warning and confines nothing.
    readOnlyPaths:
      - /etc/sessionlayer
      - /etc/ssl/certs
      - /etc/resolv.conf
      - /etc/hosts
      - /etc/nsswitch.conf
      - /usr/local/bin/gateway
      - /lib
      - /lib64
      - /usr/lib
      - /dev
      - /proc
    readWritePaths:
      - /var/lib/sessionlayer-gateway
  seccomp:
    mode: enforce

persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

service:
  type: LoadBalancer
  annotations: {}
  sshPort: 22
  agentPort: 9444
  loadBalancerSourceRanges: []
  # Local keeps the client's address, which is what ssh.sourceIpAllowlist reads.
  # Cluster hands the packet on to another node first and SNATs it, so the
  # Gateway sees a node address and the allowlist stops describing clients. The
  # cost of Local is that only nodes running a pod pass the load balancer's
  # health check. Load balancers that target pods directly, and any path that
  # sets a PROXY v2 header, keep the client address under either policy.
  # Ignored for a ClusterIP Service, which Kubernetes refuses the field on.
  externalTrafficPolicy: Local

resources:
  requests:
    cpu: 100m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

probes:
  readiness:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 3
  liveness:
    enabled: true
    periodSeconds: 15
    timeoutSeconds: 1
    failureThreshold: 3
  startup:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 30

terminationGracePeriodSeconds: 45

tmpVolume:
  enabled: true
  medium: Memory
  sizeLimit: 64Mi

# Off, because one release is one pod and a budget over a single pod has no
# middle setting: minAvailable 1 refuses every voluntary eviction and hangs a
# node drain, and 0 permits the eviction a budget exists to hold back. Session
# survival across a drain comes from running several Gateway releases, which is
# also what makes the load balancer's other backends useful.
podDisruptionBudget:
  enabled: false
  minAvailable: 0

networkPolicy:
  enabled: true
  controlPlanePodSelector:
    app.kubernetes.io/name: sessionlayer-controlplane
  # Must match the port inside controlPlane.mtlsEndpoint.
  controlPlaneGrpcPort: 9443
  dnsPodSelector:
    k8s-app: kube-dns
  nodeCidrs: []
  wormCidrs: []
  extraIngress: []
  extraEgress: []

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
