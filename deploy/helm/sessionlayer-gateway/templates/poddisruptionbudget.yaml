{{- if .Values.podDisruptionBudget.enabled }}
{{- $min := .Values.podDisruptionBudget.minAvailable }}
{{- if and (not (kindIs "string" $min)) (ge (int $min) (int .Values.replicaCount)) }}
{{- fail (printf "sessionlayer-gateway: podDisruptionBudget.minAvailable (%v) is not below replicaCount (%v), so every voluntary eviction is refused and a node drain never finishes. Raise replicaCount or lower minAvailable." $min .Values.replicaCount) }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sessionlayer-gateway.fullname" . }}
  labels:
    {{- include "sessionlayer-gateway.labels" . | nindent 4 }}
spec:
  minAvailable: {{ $min }}
  selector:
    matchLabels:
      {{- include "sessionlayer-gateway.selectorLabels" . | nindent 6 }}
{{- end }}
