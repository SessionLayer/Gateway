{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sessionlayer-gateway.fullname" . }}-data
  labels:
    {{- include "sessionlayer-gateway.labels" . | nindent 4 }}
  annotations:
    # The enrolled identity outlives the release; deleting it re-enrolls, which
    # needs a fresh single-use token.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
