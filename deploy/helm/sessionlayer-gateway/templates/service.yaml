apiVersion: v1
kind: Service
metadata:
  name: {{ include "sessionlayer-gateway.fullname" . }}
  labels:
    {{- include "sessionlayer-gateway.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "sessionlayer-gateway.selectorLabels" . | nindent 4 }}
  ports:
    # 22 on the outside, the container's high port on the inside, so nothing in
    # the pod ever needs a privileged bind.
    - name: ssh
      port: {{ .Values.service.sshPort }}
      targetPort: ssh
      protocol: TCP
    - name: agent
      port: {{ .Values.service.agentPort }}
      targetPort: agent
      protocol: TCP
