{{- if not .Values.config.existingSecret }}
{{- /*
gateway.json carries the enrollment token, so it lives in a Secret rather than
a ConfigMap even though most of the file is not sensitive.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sessionlayer-gateway.configSecretName" . }}
  labels:
    {{- include "sessionlayer-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  gateway.json: |
    {{- include "sessionlayer-gateway.config" . | nindent 4 }}
{{- end }}
