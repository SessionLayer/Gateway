{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sessionlayer-gateway.fullname" . }}
  labels:
    {{- include "sessionlayer-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sessionlayer-gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.ssh.listenPort }}
        - protocol: TCP
          port: {{ .Values.ssh.agent.listenPort }}
        - protocol: TCP
          port: {{ .Values.ha.drain.readyzPort }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- with .Values.networkPolicy.dnsPodSelector }}
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- with .Values.networkPolicy.controlPlanePodSelector }}
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.networkPolicy.controlPlaneGrpcPort }}
    {{- end }}
    {{- with .Values.networkPolicy.nodeCidrs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 22
    {{- end }}
    {{- with .Values.networkPolicy.wormCidrs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
