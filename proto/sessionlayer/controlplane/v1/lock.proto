syntax = "proto3";

package sessionlayer.controlplane.v1;

import "sessionlayer/controlplane/v1/common.proto";

option java_multiple_files = true;
option java_package = "io.sessionlayer.controlplane.grpc.v1";
option java_outer_classname = "LockProto";

// A lock lives on this INDEPENDENT push feed - never a poll that can go
// stale-open - so every Gateway honours it even under total datastore loss and in
// break-glass mode. Allow-state may fail open; deny-state (a lock) MUST fail
// closed and win.
//
// The WHOLE fleet-wide lock set is delivered to every Gateway; matching a lock
// against a live session is a purely LOCAL Gateway decision against the signed
// decision context - the CP does no per-Gateway filtering.
service LockFeed {
  // The feed opens with an authoritative SNAPSHOT, then incremental add/remove
  // events, interleaved with periodic heartbeats. On reconnect the Gateway receives
  // a fresh snapshot (a full RESYNC), so a missed event during a disconnect
  // self-heals.
  rpc StreamLocks(StreamLocksRequest) returns (stream LockEvent);
}

// StreamLocksRequest carries no authority: the AUTHENTICATED caller is the mTLS
// client certificate, not any request field.
message StreamLocksRequest {
  ComponentInfo client = 1;
}

message LockEvent {
  oneof event {
    // The authoritative full lock set (initial connect + every resync). The
    // Gateway REPLACES its local set wholesale with this.
    LockSnapshot snapshot = 1;

    // A lock created (or updated) - the Gateway adds it to its deny set, and tears
    // down matching live sessions only when the lock's mode is STRICT (which is
    // also how an unset mode is read). A BEST_EFFORT lock blocks new issuance and
    // leaves established sessions running.
    Lock added = 2;

    LockRemoval removed = 3;

    // A liveness beat. Its absence past the Gateway's threshold marks the stream
    // unhealthy, which forces per-channel re-validate (decision_ttl -> 0).
    Heartbeat heartbeat = 4;
  }
}

message LockSnapshot {
  repeated Lock locks = 1;

  // The CP feed epoch at snapshot time (monotonic within a CP process). Advisory:
  // lets the Gateway notice a feed/CP restart. This is NOT the policy_epoch.
  uint64 feed_epoch = 2;
}

message LockRemoval {
  string lock_id = 1;
}

message Heartbeat {
  int64 sent_at_epoch_seconds = 1;
}

enum LockMode {
  // Unset - an older CP that predates this field. The Gateway MUST treat this as
  // STRICT (fail safe): the prior wire had no mode and every lock tore down, so
  // absence keeps that stronger behaviour rather than silently weakening a lock.
  LOCK_MODE_UNSPECIFIED = 0;

  // Blocks new issuance AND tears down matching live sessions.
  LOCK_MODE_STRICT = 1;

  // Blocks new issuance but does NOT forcibly tear down an already-established
  // session (a softer deny used where an abrupt teardown is undesirable).
  LOCK_MODE_BEST_EFFORT = 2;
}

// A Lock is an incident-response deny: it blocks new issuance / session start
// AND tears down existing matching sessions, INDEPENDENT of TTL and CA rotation.
// The Gateway matches `target` against a live session's SIGNED decision context
// locally.
message Lock {
  string lock_id = 1;

  LockTarget target = 2;

  // Absolute expiry (Unix epoch seconds, UTC); 0 = no TTL. A DENY expires
  // CONSERVATIVELY - the Gateway keeps the lock active until clearly past this
  // (the opposite of a grant, which expires early). An expired lock only stops
  // denying; it never fails open early.
  int64 expires_at_epoch_seconds = 3;

  int64 created_at_epoch_seconds = 4;

  // The operator/audit reason. NEVER disclosed to the SSH user (a lock produces
  // the SAME generic denial as any authorization failure); it may appear only in
  // the Gateway's OPERATOR-facing log.
  string reason = 5;

  LockMode mode = 6;
}

// Facets are OR-matched. Ingest validation (CP-side) rejects a target with no
// recognised facet UNLESS `all` is explicitly true - a global lock must be
// intentional, never the result of a typo.
message LockTarget {
  repeated string identities = 1;

  repeated string groups = 2;

  repeated string node_ids = 3;

  // Linux logins (principals) the lock denies. Matches the requested principal or
  // any allowed login of the session.
  repeated string principals = 4;

  repeated string node_labels = 5;

  bool all = 6;
}
