# SessionLayer Gateway - release supply chain.
#
# On a `v*` tag: build the `gateway` binary REPRODUCIBLY, emit a CycloneDX SBOM,
# a SLSA build-provenance attestation, and keyless (OIDC) cosign signatures -
# no long-lived signing key. All third-party actions are SHA-pinned; the trailing
# `# vX.Y.Z` is the human tag. Policy: inventory + integrity, NEVER an
# NVD/OWASP scanner.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      BIN: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag is what every artifact is named and labelled after; the manifest
      # is what the binary reports about itself. Nothing forced them to agree, so
      # a tag on an unbumped tree would publish artifacts whose contents disagree
      # with their names - and for the Agent that is the anti-rollback floor, not
      # a cosmetic mismatch.
      - name: Assert the manifest version matches the tag
        run: |
          set -euo pipefail
          manifest=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$manifest" ] || { echo "::error::could not read a version from Cargo.toml"; exit 1; }
          echo "Cargo.toml: $manifest    tag: $GITHUB_REF_NAME"
          [ "v$manifest" = "$GITHUB_REF_NAME" ] || {
            echo "::error::Cargo.toml says $manifest, which does not match the tag $GITHUB_REF_NAME"
            exit 1
          }

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.97.1"

      - name: Install cargo-cyclonedx (SBOM)
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # SOURCE_DATE_EPOCH (tagged commit) + remapping the workspace (incl. the
      # vendored third_party/russh), the cargo registry, AND the double-build's
      # alternate $RUNNER_TEMP/repro target dir (below) out of the binary make it
      # byte-reproducible for an independent rebuilder. The third rule exists
      # because build.rs (tonic-prost-build) generates code under OUT_DIR - which
      # lives under the target dir, not under $PWD - and a panic/track_caller
      # location in that generated code embeds OUT_DIR's absolute path; without
      # this rule the two builds' target dirs diverge and the digests never match
      # (the same build.rs pattern breaks reproducibility for the Agent release too,
      # since it generates code under OUT_DIR the same way). (Residual: the std
      # sysroot path - bounded by pinning the exact toolchain, documented.)
      - name: Compute deterministic build env
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=$PWD=/build --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}/registry=/registry --remap-path-prefix=$RUNNER_TEMP/repro=/build/target" >> "$GITHUB_ENV"

      - name: Reproducible release build
        run: cargo build --release --locked --bin "$BIN"

      - name: Verify reproducibility (double-build digest match)
        run: |
          d1=$(sha256sum "target/release/$BIN" | awk '{print $1}')
          CARGO_TARGET_DIR="$RUNNER_TEMP/repro" cargo build --release --locked --bin "$BIN"
          d2=$(sha256sum "$RUNNER_TEMP/repro/release/$BIN" | awk '{print $1}')
          echo "digest #1: $d1"; echo "digest #2: $d2"
          if [ "$d1" != "$d2" ]; then echo "::error::release binary is not reproducible"; exit 1; fi
          rm -rf "$RUNNER_TEMP/repro"

      - name: Generate SBOM (CycloneDX 1.5, reproducible)
        run: |
          cargo cyclonedx -f json --spec-version 1.5 --all --describe binaries
          jq -S 'del(.metadata.timestamp) | del(.serialNumber)' "gateway/${BIN}_bin.cdx.json" > "${BIN}.cdx.json"
          jq -e '.bomFormat=="CycloneDX" and .specVersion=="1.5" and (.components|length>0)' "${BIN}.cdx.json" >/dev/null

      - name: Attest build provenance (SLSA)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/release/gateway
            gateway.cdx.json

      - name: Keyless cosign signatures (binary + SBOM)
        run: |
          cosign sign-blob --yes --new-bundle-format \
            --bundle "${BIN}.cosign.sigstore.json" "target/release/$BIN"
          cosign sign-blob --yes --new-bundle-format \
            --bundle "${BIN}.cdx.json.cosign.sigstore.json" "${BIN}.cdx.json"

      # A plain `cp target/release/$BIN "$BIN"` collides with this repo's own
      # top-level gateway/ crate directory (same name as the binary): cp
      # copies INTO an existing directory rather than creating a same-named
      # file, so sha256sum then fails on "gateway: Is a directory". Stage
      # every release asset under dist/ instead, which shares no name with
      # anything in the checkout.
      - name: Assemble release artifacts
        run: |
          mkdir -p dist
          cp "target/release/$BIN" "dist/$BIN"
          cp "${BIN}.cdx.json" "dist/${BIN}.cdx.json"
          cp "${BIN}.cosign.sigstore.json" "dist/${BIN}.cosign.sigstore.json"
          cp "${BIN}.cdx.json.cosign.sigstore.json" "dist/${BIN}.cdx.json.cosign.sigstore.json"
          cp "${{ steps.attest.outputs.bundle-path }}" "dist/${BIN}.provenance.sigstore.json"
          (cd dist && sha256sum "$BIN" "${BIN}.cdx.json" > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }} # via env - never interpolate a ref into the shell
        run: |
          # view-then-create, not create-then-swallow-any-error: a bare
          # `gh release create || echo "already exists"` treats an auth/API
          # failure identically to "already exists" and proceeds anyway,
          # producing a confusing failure two steps later at upload instead.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Gateway $TAG" \
            --notes "Signed, provenanced, reproducible release. Verify with cosign / gh attestation verify."
          gh release upload "$TAG" --clobber \
            "dist/$BIN" \
            "dist/${BIN}.cdx.json" \
            "dist/${BIN}.cosign.sigstore.json" \
            "dist/${BIN}.cdx.json.cosign.sigstore.json" \
            "dist/${BIN}.provenance.sigstore.json" \
            "dist/SHA256SUMS"

  # The container image carries the same integrity story as the binary: keyless
  # signatures, SLSA provenance and an SBOM, all verified here before the tag is
  # considered released. The arm64 binary is cross-compiled from the amd64 runner
  # inside the Dockerfile rather than emulated; QEMU is registered below only so
  # the published arm64 child can be EXECUTED during verification.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/sessionlayer/gateway
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Registering binfmt lets the arm64 child manifest be executed on this
      # amd64 runner. Without it the arm64 half of every published index would be
      # a platform nobody has ever run - a manifest that claims more than was
      # checked.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (linux/amd64 + linux/arm64)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Keyless cosign signature (image index + per-platform manifests)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify the published image
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          REF="${IMAGE}@${DIGEST}"
          NAME="${IMAGE#ghcr.io/}"
          IDENTITY="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/"

          verify_signature() {
          	local target="$1" n
          	cosign verify \
          		--certificate-identity-regexp "$IDENTITY" \
          		--certificate-oidc-issuer https://token.actions.githubusercontent.com \
          		"$target" >/tmp/cosign.json
          	n=$(jq 'length' /tmp/cosign.json)
          	[ "$n" -ge 1 ] || { echo "::error::cosign verify returned no signatures for $target"; exit 1; }
          	echo "signature verified: $target ($n)"
          }

          # 1. The index, and then every platform manifest under it. `cosign sign` runs
          #    with --recursive precisely so the children are signed; verifying only the
          #    index would stay green if --recursive ever stopped doing that, and the
          #    child is what a node actually resolves the index to.
          verify_signature "$REF"

          INDEX=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}')
          CHILDREN=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture != "unknown") | .digest' <<<"$INDEX")
          [ -n "$CHILDREN" ] || { echo "::error::the index lists no linux platform manifests"; exit 1; }
          for child in $CHILDREN; do verify_signature "${IMAGE}@${child}"; done

          PLATFORMS=$(jq -r '[.manifests[].platform | select(.os == "linux" and .architecture != "unknown") | .architecture] | sort | unique | join(",")' <<<"$INDEX")
          [ "$PLATFORMS" = "amd64,arm64" ] || { echo "::error::index platforms are '$PLATFORMS', expected exactly 'amd64,arm64'"; exit 1; }
          echo "platforms: $PLATFORMS"

          # 3. Provenance, pinned to this workflow on this tag. The bare
          #    `gh attestation verify --repo` form accepts an attestation from any
          #    workflow in the repository, which is the weaker form.
          gh attestation verify "oci://${REF}" \
          	--repo "$GITHUB_REPOSITORY" \
          	--signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
          	--source-ref "refs/tags/${GITHUB_REF_NAME}"

          # 4. Every platform's SBOM carries components. Summing the counts and testing
          #    the sum passes when one platform's document is empty, and the platform
          #    whose SBOM silently empties is the one nobody looks at.
          #    Match on an SPDX *document* rather than on any object carrying a
          #    `packages` key: a nested empty array inside one document would otherwise
          #    fail the release for no reason.
          docker buildx imagetools inspect "$REF" --format '{{json .SBOM}}' >sbom.json
          SBOM_COUNTS='[.. | objects | select(has("spdxVersion") and has("packages")) | .packages | length]'
          jq -e "$SBOM_COUNTS | (length > 0) and (map(. > 0) | all)" sbom.json >/dev/null \
          	|| { echo "::error::an SBOM attestation is missing or lists no components"; exit 1; }
          echo "SBOM packages per platform: $(jq -c "$SBOM_COUNTS" sbom.json)"

          TAG_DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" --format '{{json .Manifest}}' | jq -r '.digest')
          [ "$TAG_DIGEST" = "$DIGEST" ] \
          	|| { echo "::error::${IMAGE}:${GITHUB_REF_NAME} resolves to $TAG_DIGEST, not the verified $DIGEST"; exit 1; }
          echo "tag ${GITHUB_REF_NAME} -> $TAG_DIGEST"

          docker run --rm --platform linux/arm64 "$REF" --version
          echo "arm64 entrypoint ran"

          # 7. And an operator holding no credential can obtain it. A GHCR package
          #    created by a workflow is private until its visibility is set, and nothing
          #    in this pipeline sets it - so without this check the whole release goes
          #    green over an image no one can pull. Use the registry's own anonymous
          #    token endpoint rather than `docker logout`, which does not account for
          #    credentials buildx may hold elsewhere.
          #
          #    "Unreachable" and "refused" must not collapse into one message. A blamed
          #    cause the check cannot actually distinguish is the same defect this whole
          #    step exists to remove, one level down: a transient network failure would
          #    otherwise be reported as a private package, sending someone to fix a
          #    permission that was never wrong.
          TOKEN_HTTP=$(curl -sSL --retry 3 --retry-connrefused --max-time 30 \
          	-o /tmp/ghcr-token.json -w '%{http_code}' \
          	"https://ghcr.io/token?scope=repository:${NAME}:pull&service=ghcr.io" || echo 000)
          case "$TOKEN_HTTP" in
          	200) ;;
          	000) echo "::error::could not reach ghcr.io's token endpoint - this check is INCONCLUSIVE, not a pass"; exit 1 ;;
          	*) echo "::error::ghcr.io refused an anonymous pull token for ${NAME} (HTTP $TOKEN_HTTP) - the package is private, so no operator can pull what this release published"; exit 1 ;;
          esac
          TOKEN=$(jq -r '.token // empty' /tmp/ghcr-token.json)
          [ -n "$TOKEN" ] \
          	|| { echo "::error::ghcr.io returned 200 with no token for ${NAME} - INCONCLUSIVE"; exit 1; }

          CODE=$(curl -sSL --retry 3 --retry-connrefused --max-time 30 -o /dev/null -w '%{http_code}' \
          	-H "Authorization: Bearer $TOKEN" \
          	-H "Accept: application/vnd.oci.image.index.v1+json" \
          	"https://ghcr.io/v2/${NAME}/manifests/${DIGEST}" || echo 000)
          case "$CODE" in
          	200) echo "anonymous pull: 200" ;;
          	000) echo "::error::could not reach ghcr.io to resolve ${IMAGE}@${DIGEST} - INCONCLUSIVE, not a pass"; exit 1 ;;
          	401|403) echo "::error::${IMAGE} is not anonymously pullable (HTTP $CODE) - the GHCR package is private"; exit 1 ;;
          	*) echo "::error::anonymous resolve of ${IMAGE}@${DIGEST} returned HTTP $CODE"; exit 1 ;;
          esac
