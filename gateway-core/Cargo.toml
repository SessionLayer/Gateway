[package]
name = "gateway-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SessionLayer Gateway core library: SSH proxy engine, session recording, Control Plane authorization client, and HA coordination."

[lints]
workspace = true

[features]
default = []
io-uring = ["dep:tokio-uring"]
test-agent = ["dep:clap", "dep:anyhow"]

[[bin]]
name = "test-agent"
path = "src/bin/test_agent.rs"
required-features = ["test-agent"]

[dependencies]
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
russh = { workspace = true }
ssh-key = { workspace = true }
rand_core = { workspace = true }
fd-lock = { workspace = true }
zeroize = { workspace = true }
pem = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }

p256 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
x509-parser = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tokio-rustls = { workspace = true }

tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { version = "0.5", optional = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true }
tonic = { workspace = true }
anyhow = { workspace = true }
rcgen = { workspace = true, features = ["x509-parser"] }
ssh-key = { workspace = true }
rand_core = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
time = "0.3"
# Integration tests only: throwaway credential data-dirs, and the real Debian 13
# OpenSSH node. testcontainers drives Docker; never host ssh.
tempfile = "3"
testcontainers = "0.28"
hmac = "0.13"
sha2 = { workspace = true }
p256 = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
