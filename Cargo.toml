[workspace]
resolver = "2"
members = ["gateway", "gateway-core"]

[workspace.package]
version = "0.0.2"
edition = "2021"
rust-version = "1.97"
license = "GPL-3.0-only"
repository = "https://github.com/SessionLayer/Gateway"
authors = ["SessionLayer"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
gateway-core = { path = "gateway-core", version = "0.0.2" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }

# CP <-> Gateway gRPC, generated from the frozen contract (proto/). tonic 0.14
# split the prost integration into tonic-prost / tonic-prost-build. `tls-ring`
# enables the tokio-rustls transport with the *ring* provider —
# deliberately NOT aws-lc-rs, to avoid a C/asm build toolchain + license churn.
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }

rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

russh = { version = "0.62", default-features = false, features = ["ring"] }

ssh-key = { version = "0.6", default-features = false, features = ["ecdsa", "ed25519", "p256", "std", "getrandom"] }
# `OsRng` for inner-keypair generation + renew-ahead jitter (rand_core 0.6, the
# version ssh-key 0.6 speaks — kept aligned deliberately).
rand_core = { version = "0.6", features = ["getrandom"] }

fd-lock = "4"
zeroize = "1"
pem = "3"

# Recorder crypto. All RustCrypto (MIT/Apache), already in
# the dependency graph; `rsa` is deliberately NOT enabled (audit-ignored precisely
# because it is never compiled). ECIES-P256 seals the per-recording AES-256-GCM
# data key to the customer-held public key so no platform key can unwrap it.
#   * p256 (ecdh + pkcs8): ephemeral-static ECDH + DER-SPKI customer key parsing.
#   * hkdf + sha2: HKDF-SHA256 key derivation + the hash-chain / streaming digest.
#   * aes-gcm: the AES-256-GCM data + key-wrap cipher (zeroizing key schedule).
# The `ecdsa` feature (already-present transitive crates) also VERIFIES the CP's
# ECDSA-P256/SHA-256 decision-context signature (decisionctx.rs).
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
hkdf = "0.13"
sha2 = "0.11"
aes-gcm = { version = "0.11", features = ["zeroize"] }

x509-parser = { version = "0.18", features = ["verify"] }

# WORM upload: a dumb HTTP PUT of the ciphertext object to the
# CP-issued presigned URL. hyper (+util) are already transitive via tonic; no
# reqwest / webpki-roots (MPL-2.0). https uses the existing rustls (ring) stack.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body = "1"
http-body-util = "0.1"
bytes = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# The agent-facing WebSocket transport. The
# Agent dials OUT; the Gateway is the TLS+WS server. No TLS features here: the TLS
# is our own `tokio_rustls` (ring) stream, handed to tungstenite already
# established, so tungstenite never selects a crypto stack of its own.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
base64 = "0.23"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# OpenTelemetry. ONE distributed trace client -> GW ->
# CP -> node, carrying correlation IDs, NEVER plaintext. The
# OTLP exporter is compiled in but INERT unless `OTEL_EXPORTER_OTLP_ENDPOINT` is
# set (telemetry.rs); local `tracing`/fmt logging is otherwise unchanged. The
# exporter's gRPC transport is **tonic/ring** (`grpc-tonic`, no `openssl` — the
# deny.toml supply-chain policy); `reqwest`/http export is deliberately excluded.
# `metrics` adds the two native saturation gauges (`live_sessions`,
# `lock_feed_healthy`) over the SAME OTLP export path — a
# push-only PeriodicReader, never an inbound listener on the Tier-0 box.
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace", "metrics"] }
tracing-opentelemetry = "0.33"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
# Tier-0 data plane: keep integer-overflow checks on even in release. A
# byte-shoveling proxy must not silently wrap a length/offset. Cheap insurance.
overflow-checks = true

# ProxyJump host-cert MITM: russh 0.62 cannot present an SSH host
# CERTIFICATE as a server, yet ProxyJump requires one so a stock client with one
# `@cert-authority` line verifies the Gateway with no TOFU. Hence the vendored
# russh 0.62.2 + minimal gated patch; the plain-key path is byte-identical when
# `host_certificates` is empty. See the `[SessionLayer patch]` markers in
# `third_party/russh`.
[patch.crates-io]
russh = { path = "third_party/russh" }
